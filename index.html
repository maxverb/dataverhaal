<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dataviz Tool — dataverhaal.nl</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='6' fill='%233b82f6'/><rect x='4' y='16' width='6' height='12' rx='1' fill='white'/><rect x='13' y='10' width='6' height='18' rx='1' fill='white' opacity='.8'/><rect x='22' y='4' width='6' height='24' rx='1' fill='white' opacity='.6'/></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700;800&family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css?v=7">
</head>
<body>

<div class="topbar">
  <span class="tb-logo">Dataviz</span>
  <div class="tb-div"></div>
  <span class="tb-sub">dataverhaal.nl</span>
  <div class="tb-sp"></div>
  <span class="tb-sub" id="tb-updated"></span>
</div>

<div class="app">
<div class="panel">

  <!-- DATA -->
  <div class="psec">
    <div class="sh" onclick="tog(this)"><span class="sl">Data</span><span class="st open">▾</span></div>
    <div class="sc">
      <div>
        <label>Plak data (label ↹ waarde, één rij per item)</label>
        <textarea id="di" placeholder="Amsterdam	45&#10;Rotterdam	38&#10;Den Haag	22&#10;Utrecht	18&#10;Eindhoven	12" oninput="parseData()"></textarea>
      </div>
      <div class="upz" onclick="document.getElementById('fi').click()">
        ↑ CSV of XLSX uploaden
        <input type="file" id="fi" accept=".csv,.xlsx,.xls" style="display:none" onchange="handleFile(event)">
      </div>
      <div id="ds" style="font-size:11px;color:var(--pm)"></div>
      <div id="colsel"></div>
    </div>
  </div>

  <!-- TEKST -->
  <div class="psec">
    <div class="sh" onclick="tog(this)"><span class="sl">Tekst</span><span class="st open">▾</span></div>
    <div class="sc">
      <button class="btn btn-sm" onclick="suggestText()" style="margin-bottom:5px">✦ Stel tekst voor</button>
      <div><label>Eyebrow</label><input type="text" id="eyebrow" placeholder="ANALYSE · 2025" oninput="sched()"></div>
      <div><label>Titel</label><input type="text" id="ttl" placeholder="Titel van de grafiek" oninput="sched()"></div>
      <div><label>Subtitel</label><input type="text" id="sub" placeholder="De stijging stagneerd met zo'n..." oninput="sched()"></div>
      <div><label>Bron</label><input type="text" id="bron" placeholder="Bron: CBS" oninput="sched()"></div>
      <div><label>Datum</label><input type="text" id="datum" placeholder="Bijv. 2025 of 1 jan 2025" oninput="sched()"></div>
    </div>
  </div>

  <!-- GRAFIEK -->
  <div class="psec">
    <div class="sh" onclick="tog(this)"><span class="sl">Grafiek</span><span class="st open">▾</span></div>
    <div class="sc">
      <div><label>Type</label>
        <div class="tg" id="ctg"></div>
      </div>
      <div><label>Sortering</label>
        <select id="srt" onchange="sched()">
          <option value="none">Origineel</option>
          <option value="desc">Aflopend (hoog→laag)</option>
          <option value="asc">Oplopend (laag→hoog)</option>
        </select>
      </div>
      <div><label>Max. rijen</label>
        <select id="mr" onchange="sched()">
          <option value="all">Alle</option>
          <option value="5">Top 5</option>
          <option value="10">Top 10</option>
          <option value="15">Top 15</option>
        </select>
      </div>
      <div><label>Eenheid / suffix</label>
        <select id="unit" onchange="sched()">
          <option value="auto">Automatisch (k, M)</option>
          <option value="none">Geen (exacte waarde)</option>
          <option value="pct">%</option>
          <option value="eur">€</option>
          <option value="usd">$</option>
          <option value="k">k (duizendtallen)</option>
          <option value="M">M (miljoenen)</option>
        </select>
      </div>
      <div><label>Weergave</label>
        <select id="dispmode" onchange="sched()">
          <option value="abs">Absoluut</option>
          <option value="pct">Percentage van totaal</option>
        </select>
      </div>
    </div>
  </div>
  <!-- STIJL -->
  <div class="psec">
    <div class="sh" onclick="tog(this)"><span class="sl">Stijl</span><span class="st open">▾</span></div>
    <div class="sc">
      <div><label>Kleurpalet</label><div class="pal-grid" id="pg"></div></div>
      <div style="display:flex;gap:5px;align-items:center">
        <label style="flex-shrink:0">Custom kleur</label>
        <input type="color" id="cc-pick" value="#3b82f6" onchange="setCustomClr(this.value)" style="width:28px;height:28px;padding:0;border:1px solid var(--ibr);border-radius:4px;cursor:pointer">
        <input type="text" id="cc-hex" placeholder="#3b82f6" oninput="setCustomClr(this.value)" style="flex:1;font-size:11px">
        <button class="btn btn-sm" onclick="clearCustomClr()">✕</button>
      </div>
    </div>
  </div>

  <!-- FORMAAT -->
  <div class="psec">
    <div class="sh" onclick="tog(this)"><span class="sl">Formaat</span><span class="st open">▾</span></div>
    <div class="sc">
      <div class="tg" id="fg" style="flex-wrap:wrap;gap:4px"></div>
    </div>
  </div>

  <!-- FILTERS -->
  <div class="psec">
    <div class="sh" onclick="tog(this)"><span class="sl">Filters</span><span class="st open">▾</span></div>
    <div class="sc">
      <label class="chk"><input type="checkbox" id="fg-grid" checked onchange="sched()"> Rasterlijnen</label>
      <label class="chk"><input type="checkbox" id="fg-val" checked onchange="sched()"> Waarden op staven</label>
      <label class="chk"><input type="checkbox" id="fg-xl" checked onchange="sched()"> X-as labels</label>
      <label class="chk"><input type="checkbox" id="fg-trend" onchange="sched()"> Trendlijn</label>
      <label class="chk"><input type="checkbox" id="fg-ma" onchange="sched()"> Voortschr. gemiddelde (7)</label>
      <div><label>Branding</label>
        <select id="fg-br" onchange="sched()">
          <option value="none">Geen</option>
          <option value="dataverhaal" selected>dataverhaal.nl</option>
          <option value="maxverbeek">Max Verbeek</option>
        </select>
      </div>
    </div>
  </div>

  <!-- CONFIGURATIES -->
  <div class="psec">
    <div class="sh" onclick="tog(this)"><span class="sl">Configuraties</span><span class="st open">▾</span></div>
    <div class="sc">
      <div style="display:flex;gap:5px">
        <input type="text" id="cn" placeholder="Naam configuratie" style="flex:1">
        <button class="btn btn-sm" onclick="saveCfg()">Opslaan</button>
      </div>
      <div class="cfg-list" id="cl"></div>
    </div>
  </div>

</div><!-- /panel -->

<!-- PREVIEW -->
<div class="preview">
  <div class="ptb">
    <span class="pfl" id="pfl">IG Post 4:5</span>
    <span class="pdim" id="pdim">1080 × 1350</span>
    <div class="psp"></div>
    <button class="btn btn-sm" onclick="reverseData()" title="Draai volgorde om">⇅ Volgorde</button>
    <button class="btn btn-sm" onclick="copyToClipboard()" title="Kopieer naar klembord">📋 Kopieer</button>
    <button class="btn btn-p" onclick="exportPNG()">⬇ Download PNG</button>
  </div>
  <div class="cwrap"><canvas id="cv"></canvas></div>
</div>
</div>

<script src="js/core.js?v=7"></script>
<script src="js/helpers.js?v=3"></script>
<script src="js/parse.js?v=3"></script>
<script src="js/render.js?v=7"></script>
<script src="js/charts/bar.js?v=7"></script>
<script src="js/charts/barh.js?v=3"></script>
<script src="js/charts/line.js?v=7"></script>
<script src="js/charts/donut.js?v=3"></script>
<script src="js/charts/waterfall.js?v=3"></script>
<script src="js/charts/heatmap.js?v=3"></script>
<script src="js/charts/area.js?v=6"></script>
<script src="js/charts/stacked.js?v=4"></script>
<script src="js/charts/cards.js?v=5"></script>
<script src="js/charts/table.js?v=6"></script>
<script src="js/suggest.js?v=4"></script>
<script src="js/interact.js?v=7"></script>
<script src="js/ui.js?v=7"></script>
</body>
</html>
