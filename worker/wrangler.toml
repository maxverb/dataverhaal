name = "dataverhaal-scraper"
main = "index.js"
compatibility_date = "2024-01-01"

# KV namespace binding — create via:
# wrangler kv:namespace create RSS_CACHE
# Then paste the id below
[[kv_namespaces]]
binding = "RSS_CACHE"
id = "REPLACE_WITH_YOUR_KV_NAMESPACE_ID"

# Cron trigger: every hour
[triggers]
crons = ["0 * * * *"]
